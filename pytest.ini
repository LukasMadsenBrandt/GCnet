[pytest]
testpaths = tests
markers =
    unit: fast isolated tests for functions and small modules
    integration: multi-stage pipeline tests using fixtures
    slow: tests that are useful but too slow for every local commit
    real_gc: tests that execute statsmodels Granger causality calculations
    visual: tests that validate generated visual artifacts
    cuda: tests that require a CUDA-capable environment
    cuda_parity: CPU/GPU numerical or scientific-output parity tests
    cuda_benchmark: CPU/GPU benchmark tests that write speedup metrics
