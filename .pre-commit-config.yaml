repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Publication_Material/|.*\.(md|svg|csv|xlsx|docx)$
      - id: end-of-file-fixer
        exclude: ^Publication_Material/|.*\.(md|svg|csv|xlsx|docx)$
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^Publication_Material/

  - repo: local
    hooks:
      - id: py-compile-canonical
        name: py_compile canonical Python files
        entry: python -m py_compile
        language: system
        files: ^(gene_analysis|gene_analysis_common|scripts/pipeline|scripts/reporting|tests)/.*\.py$
      - id: pytest-fast
        name: pytest fast suite with coverage
        entry: python -m pytest tests -m "not slow and not real_gc and not cuda" --cov --cov-fail-under=75
        language: system
        pass_filenames: false
