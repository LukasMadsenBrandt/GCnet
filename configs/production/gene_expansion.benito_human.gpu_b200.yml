# Production GPU-GC config for B200/HPC nodes.
# Before running, install requirements-cuda-cupy.txt and export CUDA_PATH plus
# the NVIDIA pip-package lib directories as described in docs/GPU_ACCELERATION.md.
run_name: mecp2_benito_human_gpu_b200_00015

dataset:
  name: benito_human
  expression_file: Data/Benito/Benito_Human
  full_gene_file: Data/Benito/unique_genes.txt

gene_of_interest: MECP2
seed_gene_file: Data/Benito/unique_genes.txt

preprocessing:
  normalize: none
  transform: log1p
  aggregation: robust

network:
  p_value_threshold: 0.01
  write_svg: true
  svg_renderer: networkx
  svg_layout: dot

consensus:
  initial_runs: 5000
  run_increment_fraction: 0.20
  stability_quantile: 0.90
  stability_tolerance: 0.05
  top_overlap_threshold_percent: 95.0

probe_selection:
  mode: top_percent
  top_percent: 5.0
  min_frequency: null

execution:
  max_workers: null
  chunk_size: 1000000
  resume: true
  gc_backend: gpu_cuda
  consensus_backend: cpu_louvain
  gpu_device: 0

artifacts: {}
