run_name: zeb2_kutsche_real_gc_small

dataset:
  name: kutsche
  expression_file: Data/Kutsche/Kutsche_Counts.txt
  full_gene_file: examples/kutsche_real_gc/all_genes.txt

gene_of_interest: ZEB2
seed_gene_file: examples/kutsche_real_gc/seed_genes.txt

preprocessing:
  normalize: none
  transform: none
  aggregation: robust

network:
  p_value_threshold: 1.0
  write_svg: true
  svg_renderer: networkx
  svg_layout: dot

consensus:
  initial_runs: 5
  run_increment_fraction: 1.0
  stability_quantile: 0.90
  stability_tolerance: 1000000000.0
  top_overlap_threshold_percent: 0.0

probe_selection:
  mode: top_percent
  top_percent: 50.0
  min_frequency: null

execution:
  max_workers: 1
  chunk_size: 100
  resume: false
  gc_backend: cpu_statsmodels
  consensus_backend: cpu_louvain
  gpu_device: null

artifacts: {}
