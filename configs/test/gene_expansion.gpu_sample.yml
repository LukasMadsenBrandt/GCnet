run_name: sample_gpu

dataset:
  name: sample_real_gc
  expression_file: examples/sample_real_gc/expression.csv
  full_gene_file: examples/sample_real_gc/all_genes.txt

gene_of_interest: ZEB2
seed_gene_file: examples/sample_real_gc/seed_genes.txt

preprocessing:
  normalize: none
  transform: none
  aggregation: robust

network:
  p_value_threshold: 0.001
  write_svg: true
  svg_renderer: networkx
  svg_layout: dot

consensus:
  initial_runs: 5
  run_increment_fraction: 1.0
  stability_quantile: 0.90
  stability_tolerance: 1000000000.0
  top_overlap_threshold_percent: 0.0

probe_selection:
  mode: top_percent
  top_percent: 50.0
  min_frequency: null

execution:
  max_workers: 1
  chunk_size: 100
  resume: false
  gc_backend: gpu_cuda
  consensus_backend: cpu_louvain
  gpu_device: 0

artifacts: {}
